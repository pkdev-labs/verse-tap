name: Tests

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.3', '8.4', '8.5' ]
        dependencies: [ 'highest' ]
        include:
          - php-version: '8.3'
            dependencies: 'lowest'

    name: PHP ${{ matrix.php-version }} (${{ matrix.dependencies }})

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-interaction --no-progress

      # Composer refuses versions with security advisories by default, which would lift the
      # floor above what composer.json declares. This job exists to prove the declared floor.
      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1
        run: composer update --prefer-dist --prefer-lowest --no-interaction --no-progress

      - name: Run the test suite
        run: composer test

  quality:
    runs-on: ubuntu-latest
    name: PHPStan and Pint

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: composer analyze -- --no-progress

      - name: Pint
        run: vendor/bin/pint --test
